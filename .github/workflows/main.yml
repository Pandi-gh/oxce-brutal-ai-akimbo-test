name: Build Custom OXCE

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix sloppy author flags
      # Скрипт-санитар: ищет и удаляет линуксовый флаг из всех файлов настроек CMake, чтобы MSVC не ругался
      run: |
        Get-ChildItem -Include CMakeLists.txt,*.cmake -Recurse | ForEach-Object {
          (Get-Content $_.FullName) -replace '-Wno-unused', '' | Set-Content $_.FullName
        }

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-OXCE-Exe
        path: ${{github.workspace}}/build/Release/*.exe
