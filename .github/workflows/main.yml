name: Build Custom OXCE (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-SDL
          mingw-w64-x86_64-SDL_mixer
          mingw-w64-x86_64-SDL_image
          mingw-w64-x86_64-SDL_gfx
          mingw-w64-x86_64-yaml-cpp

    - name: Create missing data directories
      run: |
        mkdir -p bin/TFTD
        mkdir -p bin/UFO
        mkdir -p bin/common
        mkdir -p bin/standard

    # ИСПРАВЛЕНИЕ: Добавлен огромный список медиа-зависимостей (mad, vorbis, png, jpeg и т.д.)
    # Они ставятся перед системными библиотеками Windows.
    - name: Configure CMake
      run: >
        cmake -G "MinGW Makefiles" -B build 
        -DCMAKE_BUILD_TYPE=Release 
        -DCMAKE_CXX_STANDARD_LIBRARIES="-lmad -lFLAC -lvorbisfile -lvorbis -logg -lmodplug -lsmpeg -lpng -ljpeg -ltiff -lwebp -lz -ldxguid -ldinput8 -ldinput -lwinmm -lole32 -loleaut32 -lsetupapi -luuid -limm32 -lversion -lws2_32"

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Bundle required DLLs
      run: |
        ldd build/bin/openxcom.exe | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp -n {} build/bin/ || true
        cp -n /mingw64/bin/libgcc_s_seh-1.dll build/bin/ || true
        cp -n /mingw64/bin/libstdc++-6.dll build/bin/ || true
        cp -n /mingw64/bin/libwinpthread-1.dll build/bin/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenXcom-windows-build
        path: build/bin/
