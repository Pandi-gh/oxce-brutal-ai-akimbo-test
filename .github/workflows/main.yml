name: Build Custom OXCE (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-SDL
          mingw-w64-x86_64-SDL_mixer
          mingw-w64-x86_64-SDL_image
          mingw-w64-x86_64-SDL_gfx
          mingw-w64-x86_64-yaml-cpp

    - name: Create missing data directories
      run: |
        mkdir -p bin/TFTD
        mkdir -p bin/UFO
        mkdir -p bin/common
        mkdir -p bin/standard

    # ИСПРАВЛЕНИЕ ЗДЕСЬ: Добавлены флаги линковщика CMAKE_EXE_LINKER_FLAGS
    - name: Configure CMake
      run: >
        cmake -G "MinGW Makefiles" -B build 
        -DCMAKE_BUILD_TYPE=Release 
        -DCMAKE_EXE_LINKER_FLAGS="-ldxguid -ldinput8 -lwinmm -lole32 -loleaut32 -lversion -limm32"

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Bundle required DLLs
      run: |
        ldd build/bin/openxcom.exe | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp -n {} build/bin/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenXcom-windows-build
        path: build/bin/
