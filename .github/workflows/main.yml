name: Build Custom OXCE (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    # Указываем, что все команды bash должны выполняться внутри среды MSYS2
    defaults:
      run:
        shell: msys2 {0}

    steps:
    # 1. Загружаем код
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Устанавливаем среду MSYS2 и библиотеки (аналог apt-get, но для Windows)
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-SDL2_mixer
          mingw-w64-x86_64-SDL2_image
          mingw-w64-x86_64-SDL2_gfx
          mingw-w64-x86_64-yaml-cpp

    # 3. Создаем пустые папки
    - name: Create missing data directories
      run: |
        mkdir -p bin/TFTD
        mkdir -p bin/UFO
        mkdir -p bin/common
        mkdir -p bin/standard

    # 4. Конфигурация (используем MinGW Makefiles)
    - name: Configure CMake
      run: cmake -G "MinGW Makefiles" -B build -DCMAKE_BUILD_TYPE=Release

    # 5. Сборка
    - name: Build
      run: cmake --build build -j$(nproc)

    # 6. Копируем DLL файлы. Windows .exe файл не запустится без этих библиотек.
    - name: Copy DLLs
      run: |
        cp /mingw64/bin/SDL2.dll build/bin/
        cp /mingw64/bin/SDL2_mixer.dll build/bin/
        cp /mingw64/bin/SDL2_image.dll build/bin/
        cp /mingw64/bin/SDL2_gfx.dll build/bin/
        cp /mingw64/bin/libyaml-cpp*.dll build/bin/
        cp /mingw64/bin/libstdc++-6.dll build/bin/
        cp /mingw64/bin/libgcc_s_seh-1.dll build/bin/
        cp /mingw64/bin/libwinpthread-1.dll build/bin/

    # 7. Загружаем папку bin целиком (в ней будет .exe и все нужные .dll)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenXcom-windows-build
        path: build/bin/
