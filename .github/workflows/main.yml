name: Build Custom OXCE (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    # Указываем, что все команды bash должны выполняться внутри среды MSYS2
    defaults:
      run:
        shell: msys2 {0}

    steps:
    # 1. Загружаем код
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Устанавливаем среду MSYS2 и библиотеки (ОБРАТИТЕ ВНИМАНИЕ: тут SDL версии 1.2)
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-SDL
          mingw-w64-x86_64-SDL_mixer
          mingw-w64-x86_64-SDL_image
          mingw-w64-x86_64-SDL_gfx
          mingw-w64-x86_64-yaml-cpp

    # 3. Создаем пустые папки
    - name: Create missing data directories
      run: |
        mkdir -p bin/TFTD
        mkdir -p bin/UFO
        mkdir -p bin/common
        mkdir -p bin/standard

    # 4. Конфигурация (используем MinGW Makefiles)
    - name: Configure CMake
      run: cmake -G "MinGW Makefiles" -B build -DCMAKE_BUILD_TYPE=Release

    # 5. Сборка
    - name: Build
      run: cmake --build build -j$(nproc)

    # 6. Автоматическое копирование всех необходимых DLL к exe-файлу
    - name: Bundle required DLLs
      run: |
        ldd build/bin/openxcom.exe | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp {} build/bin/ || true

    # 7. Загружаем папку bin целиком (в ней будет .exe и все нужные .dll)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenXcom-windows-build
        path: build/bin/
