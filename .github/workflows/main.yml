name: Build Custom OXCE (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # Указываем, что все команды ниже должны выполняться в среде MSYS2 (MinGW)
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Устанавливаем MSYS2 и все необходимые зависимости для компиляции под Windows
    - name: Setup MSYS2 and Install Dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          make
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-SDL2_gfx
          mingw-w64-x86_64-SDL2_image
          mingw-w64-x86_64-SDL2_mixer
          mingw-w64-x86_64-SDL
          mingw-w64-x86_64-SDL_gfx
          mingw-w64-x86_64-SDL_image
          mingw-w64-x86_64-SDL_mixer
          mingw-w64-x86_64-glew
          mingw-w64-x86_64-yaml-cpp

    # Создаем пустые папки, чтобы CMake не ругался при копировании
    - name: Create missing data directories
      run: |
        mkdir -p bin/TFTD
        mkdir -p bin/UFO
        mkdir -p bin/common
        mkdir -p bin/standard

    # Конфигурация (явно указываем генератор MinGW Makefiles)
    - name: Configure CMake
      run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

    # Сборка
    - name: Build
      run: cmake --build build -j$(nproc)

    # КРИТИЧЕСКИ ВАЖНЫЙ ШАГ: Копируем все нужные DLL к exe-файлу
    - name: Bundle required DLLs
      run: |
        # ldd проверяет, какие библиотеки нужны exe-файлу, а awk и xargs копируют их из папки MinGW в нашу папку build/bin
        ldd build/bin/openxcom.exe | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp {} build/bin/ || true

    # Загрузка артефакта
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenXcom-windows-build
        # Загружаем всю папку bin, так как там теперь лежит и сам .exe, и все .dll
        path: build/bin/
