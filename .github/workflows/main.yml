name: Build Custom OXCE (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-yaml-cpp
          mingw-w64-x86_64-glew
          mingw-w64-x86_64-SDL
          mingw-w64-x86_64-SDL_mixer
          mingw-w64-x86_64-SDL_image
          mingw-w64-x86_64-SDL_gfx
          mingw-w64-x86_64-libmad
          mingw-w64-x86_64-libvorbis
          mingw-w64-x86_64-flac
          mingw-w64-x86_64-libmodplug
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-libtiff
          mingw-w64-x86_64-libwebp
          mingw-w64-x86_64-zstd
          mingw-w64-x86_64-xz
          mingw-w64-x86_64-jbigkit
          mingw-w64-x86_64-libdeflate
          mingw-w64-x86_64-lerc

    # МАГИЯ ЗДЕСЬ: Удаляем статические библиотеки, чтобы заставить CMake использовать DLL
    - name: Force Dynamic Linking
      run: |
        rm -f /mingw64/lib/libFLAC.a
        rm -f /mingw64/lib/libtiff.a
        rm -f /mingw64/lib/libwebp.a
        rm -f /mingw64/lib/libsharpyuv.a
        rm -f /mingw64/lib/libjpeg.a
        rm -f /mingw64/lib/libpng16.a
        rm -f /mingw64/lib/libjbig.a
        rm -f /mingw64/lib/libdeflate.a
        rm -f /mingw64/lib/libLerc.a
        rm -f /mingw64/lib/libzstd.a
        rm -f /mingw64/lib/liblzma.a
        rm -f /mingw64/lib/libvorbis.a
        rm -f /mingw64/lib/libvorbisfile.a
        rm -f /mingw64/lib/libvorbisenc.a
        rm -f /mingw64/lib/libogg.a
        rm -f /mingw64/lib/libmad.a
        rm -f /mingw64/lib/libmodplug.a
        rm -f /mingw64/lib/libSDL.a
        rm -f /mingw64/lib/libSDL_image.a
        rm -f /mingw64/lib/libSDL_mixer.a
        rm -f /mingw64/lib/libSDL_gfx.a

    - name: Create missing data directories
      run: |
        mkdir -p bin/TFTD
        mkdir -p bin/UFO
        mkdir -p bin/common
        mkdir -p bin/standard

    # Конфигурация стала максимально чистой!
    - name: Configure CMake
      run: >
        cmake -G "MinGW Makefiles" -B build 
        -DCMAKE_BUILD_TYPE=Release 
        -DCMAKE_EXE_LINKER_FLAGS="-ldxguid -ldinput -lwinmm -lole32 -loleaut32 -lsetupapi -luuid -limm32 -lversion -lws2_32"

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Bundle required DLLs
      run: |
        # Копируем все DLL, от которых зависит exe
        ldd build/bin/openxcom.exe | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp -n {} build/bin/ || true
        
        # Базовые библиотеки C++ MinGW
        cp -n /mingw64/bin/libgcc_s_seh-1.dll build/bin/ || true
        cp -n /mingw64/bin/libstdc++-6.dll build/bin/ || true
        cp -n /mingw64/bin/libwinpthread-1.dll build/bin/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenXcom-windows-build
        path: build/bin/
