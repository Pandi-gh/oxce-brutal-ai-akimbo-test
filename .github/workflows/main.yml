name: Build Custom OXCE (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        # Возвращаем чистый список только самых главных библиотек
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-yaml-cpp
          mingw-w64-x86_64-SDL
          mingw-w64-x86_64-SDL_mixer
          mingw-w64-x86_64-SDL_image
          mingw-w64-x86_64-SDL_gfx

    # МАГИЯ ЗДЕСЬ: Вырезаем команду, которая заставляла CMake ломать нам линковку
    - name: Force Dynamic Linking
      run: |
        sed -i 's/CMAKE_FIND_LIBRARY_SUFFIXES/DISABLED_SUFFIXES/g' CMakeLists.txt

    - name: Create missing data directories
      run: |
        mkdir -p bin/TFTD
        mkdir -p bin/UFO
        mkdir -p bin/common
        mkdir -p bin/standard

    # Больше никаких гигантских строк с -lmad -lFLAC и т.д. Всё сработает автоматически!
    - name: Configure CMake
      run: cmake -G "MinGW Makefiles" -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Bundle required DLLs
      run: |
        ldd build/bin/openxcom.exe | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp -n {} build/bin/ || true
        cp -n /mingw64/bin/libgcc_s_seh-1.dll build/bin/ || true
        cp -n /mingw64/bin/libstdc++-6.dll build/bin/ || true
        cp -n /mingw64/bin/libwinpthread-1.dll build/bin/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenXcom-windows-build
        path: build/bin/
