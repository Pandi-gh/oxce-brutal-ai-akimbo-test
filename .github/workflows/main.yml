name: Build Custom OXCE

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Dependencies
      # Исправленная ссылка! Теперь скачается без ошибки 404
      run: |
        Invoke-WebRequest -Uri "https://github.com/OpenXcom/OpenXcom/releases/download/1.0/deps.zip" -OutFile "deps.zip"
        Expand-Archive -Path "deps.zip" -DestinationPath "."

    - name: Fix sloppy author flags
      run: |
        Get-ChildItem -Include CMakeLists.txt,*.cmake -Recurse | ForEach-Object {
          (Get-Content $_.FullName) -replace '-Wno-unused', '' | Set-Content $_.FullName
        }

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{github.workspace}}/deps"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-OXCE-Exe
        path: ${{github.workspace}}/build/Release/*.exe
